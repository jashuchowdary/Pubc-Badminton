<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new-folder--2-</title>
  </head>
  <body>
    <!-- Debug Overlay -->
    <div id="debug-err" style="display:none; position:fixed; top:0; left:0; right:0; background:red; color:white; padding:10px; z-index:9999; white-space:pre-wrap; font-family:monospace; max-height:50vh; overflow:auto;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var d = document.getElementById('debug-err');
        d.style.display = 'block';
        d.innerText += "Error: " + msg + "\n" + (error ? error.stack : "") + "\n";
      };
      window.onunhandledrejection = function(e) {
        var d = document.getElementById('debug-err');
        d.style.display = 'block';
        d.innerText += "Rejection: " + e.reason + "\n";
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
